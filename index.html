    <!-- Entity graph.

         several weakly-linked people instead of one well-attested entity, which
         is what kept Ahmad off page one for his own name. Do not re-point it. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://ahmadshayan.com/#ahmad-shayan",

          "worksFor": { "@id": "https://ahmasoft.com/#organization" },
          "knowsAbout": [
            "Claude Code",
            "Claude Code Coaching",
            "AI Software Development",
            "AI Agents",
            "Workflow Automation"
          ],
          "sameAs": [
            "https://www.linkedin.com/in/ehmadshayan/",
            "https://github.com/AhmadShayan",
            "https://www.upwork.com/freelancers/ehmadshayan",
            "https://www.instagram.com/the.ahmadshayan/",
            "https://ahmadshayan.com/"
          ]
        },
        {
          "@type": "Organization",
          "@id": "https://ahmasoft.com/#organization",
          "name": "Ahmasoft",
          "url": "https://ahmasoft.com",
          "foundingDate": "2025-02",
          "founder": { "@id": "https://ahmadshayan.com/#ahmad-shayan" },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Lahore",
            "addressCountry": "PK"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://coach.ahmasoft.com/#website",
          "url": "https://coach.ahmasoft.com",
          "name": "Ahmasoft Coaching",
          "inLanguage": "en-US",
          "publisher": { "@id": "https://ahmadshayan.com/#ahmad-shayan" }
        },
        {
          "@type": "Service",
          "@id": "https://coach.ahmasoft.com/#builder-sprint",
          "name": "Claude Code Builder Sprint",
          "serviceType": "1-on-1 AI software coaching",
          "description": "Private 1-on-1 coaching that takes a non-technical operator from zero to a deployed AI tool, usually in one or two live sessions.",
          "provider": { "@id": "https://ahmadshayan.com/#ahmad-shayan" },
          "areaServed": "Worldwide",
          "offers": {
            "@type": "Offer",
            "price": "250",
            "priceCurrency": "USD",
            "description": "Flat fee for the Builder Sprint. Full refund if no working AI tool is deployed by the end.",
            "url": "https://coach.ahmasoft.com/book"
          },
          "availableChannel": {
            "@type": "ServiceChannel",
            "serviceUrl": "https://coach.ahmasoft.com/book",
            "availableLanguage": "English"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://coach.ahmasoft.com/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Do I need to be technical?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Most clients are VPs and directors with no coding background. Setup is point-and-click. Building is conversational. You prompt, Claude codes."
              }
            },
            {
              "@type": "Question",
              "name": "How long does the Sprint take?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most clients finish in two sessions of about 90 minutes each. Technical clients often do two sessions of an hour each. Some prefer one longer sitting. We pace to fit you, not a fixed clock."
              }
            },
            {
              "@type": "Question",
              "name": "What if I do not know what I want to build?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "That is what the first 10 minutes are for. Clients arrive with a vague idea and leave with a concrete plan."
              }
            },
            {
              "@type": "Question",
              "name": "Will I need to pay for Claude API?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, but it is small. Plan on $5 to $15 a month as you build. Cost controls are covered in Session 1."
              }
            },
            {
              "@type": "Question",
              "name": "What happens after the Sprint?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You leave with everything working and a recall doc as your reference. About 70% of clients come back for ongoing coaching at $50/hr. The rest take it from there on their own."
